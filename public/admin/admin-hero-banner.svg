<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#7c3aed" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Abstract chart outlines -->
  <g filter="url(#blur)">
    <!-- Bar chart ghost -->
    <rect x="120" y="260" width="30" height="80" rx="4" fill="#7c3aed" opacity="0.15"/>
    <rect x="160" y="220" width="30" height="120" rx="4" fill="#7c3aed" opacity="0.12"/>
    <rect x="200" y="280" width="30" height="60" rx="4" fill="#7c3aed" opacity="0.1"/>
    <rect x="240" y="240" width="30" height="100" rx="4" fill="#7c3aed" opacity="0.13"/>
    <rect x="280" y="200" width="30" height="140" rx="4" fill="#7c3aed" opacity="0.11"/>

    <!-- Line chart ghost -->
    <polyline points="500,300 560,250 620,270 680,210 740,230 800,180 860,200"
      fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.2"/>

    <!-- Pie chart ghost -->
    <circle cx="1020" cy="200" r="60" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.15"/>
    <path d="M1020,200 L1020,140 A60,60 0 0,1 1072,230 Z" fill="#7c3aed" opacity="0.1"/>
  </g>

  <!-- Glowing accent orbs -->
  <circle cx="150" cy="100" r="120" fill="#7c3aed" opacity="0.04"/>
  <circle cx="1050" cy="80" r="100" fill="#a78bfa" opacity="0.03"/>
  <circle cx="600" cy="350" r="150" fill="#7c3aed" opacity="0.03"/>

  <!-- Neon network lines -->
  <g stroke="url(#glow)" stroke-width="1.5" fill="none" opacity="0.4">
    <line x1="400" y1="60" x2="550" y2="120"/>
    <line x1="550" y1="120" x2="700" y2="80"/>
    <line x1="700" y1="80" x2="850" y2="150"/>
    <line x1="550" y1="120" x2="600" y2="200"/>
  </g>

  <!-- Node dots -->
  <g fill="#7c3aed">
    <circle cx="400" cy="60" r="4" opacity="0.6"/>
    <circle cx="550" cy="120" r="5" opacity="0.7"/>
    <circle cx="700" cy="80" r="4" opacity="0.6"/>
    <circle cx="850" cy="150" r="4" opacity="0.5"/>
    <circle cx="600" cy="200" r="3" opacity="0.5"/>
  </g>
</svg>
